<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>세이버 노트 · 데모</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F5F0; --surface:#FFFFFF; --ink:#1E2A3A; --soft:#5A6676; --line:#CBD3CC;
  --grid:rgba(30,42,58,.055); --seam:#C8102E; --field:#2E6B4A; --chip:#E4EAE3; --track:#D9DFDA;
  --warn:#9A6A00;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121821; --surface:#1A2230; --ink:#E6EBF0; --soft:#97A3B1; --line:#2E3949;
    --grid:rgba(230,235,240,.04); --seam:#FF5A6E; --field:#5FBF8A; --chip:#243041; --track:#2E3949;
    --warn:#E8B64A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121821; --surface:#1A2230; --ink:#E6EBF0; --soft:#97A3B1; --line:#2E3949;
  --grid:rgba(230,235,240,.04); --seam:#FF5A6E; --field:#5FBF8A; --chip:#243041; --track:#2E3949;
  --warn:#E8B64A;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;color:var(--ink);background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  font-size:16px;line-height:1.6;font-variant-numeric:tabular-nums;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--seam);outline-offset:2px}
.display{font-family:"Black Han Sans","IBM Plex Sans KR",sans-serif;font-weight:400;letter-spacing:-.01em}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{max-width:1040px;margin:0 auto;padding:10px 20px 0;display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap}
.brand{font-size:1.5rem;line-height:1;padding-bottom:12px}
.brand small{font-family:"IBM Plex Sans KR",sans-serif;font-size:.75rem;color:var(--soft);margin-left:8px;font-weight:500}
nav{display:flex;gap:4px}
nav button{background:none;border:0;padding:8px 14px 12px;cursor:pointer;color:var(--soft);font-weight:500;position:relative}
nav button[aria-current="page"]{color:var(--ink);font-weight:700}
nav button[aria-current="page"]::after{
  content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:4px;
  background:repeating-linear-gradient(90deg,var(--seam) 0 6px,transparent 6px 10px);
}
.notice{max-width:1040px;margin:0 auto;padding:10px 20px;color:var(--soft);font-size:.85rem}

main{max-width:1040px;margin:0 auto;padding:8px 20px 64px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px}
.row{display:flex;gap:16px;flex-wrap:wrap}
.muted{color:var(--soft)}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:4px;cursor:pointer;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.chip{border:1px solid var(--line);background:var(--chip);padding:6px 12px;border-radius:999px;cursor:pointer}

/* home */
.hero{padding:40px 0 24px}
.hero h1{font-size:clamp(2rem,6vw,3.4rem);line-height:1.1;margin:0 0 20px}
.search{position:relative;max-width:560px}
.search input{width:100%;padding:14px 16px;border:2px solid var(--ink);border-radius:6px;background:var(--surface);font-size:1.1rem}
.ac{position:absolute;left:0;right:0;top:100%;margin:4px 0 0;padding:4px;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:6px;z-index:4;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.ac button{display:flex;justify-content:space-between;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:4px;cursor:pointer}
.ac button:hover,.ac button:focus-visible{background:var(--chip)}
.popular{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lists{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:24px}
.rank{list-style:none;margin:0;padding:0}
.rank li button{display:grid;grid-template-columns:2ch 1fr auto;gap:12px;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:10px 2px;text-align:left;cursor:pointer}
.rank li:first-child button{border-top:0}
.rank .n{color:var(--soft)}
h2{font-size:1.05rem;margin:0 0 10px}

/* player card */
.ph{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start;margin-bottom:12px}
.ph h1{font-size:clamp(2rem,5vw,2.8rem);margin:0;line-height:1.1}
.meta{display:flex;gap:6px 14px;flex-wrap:wrap;color:var(--soft);font-size:.9rem;margin-top:6px}
.basis{display:inline-block;font-size:.8rem;border:1px dashed var(--seam);color:var(--seam);padding:2px 8px;border-radius:4px;margin-top:8px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:16px 0 8px}
.tabs button{background:none;border:0;padding:8px 14px;cursor:pointer;color:var(--soft);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}
.metric{display:grid;grid-template-columns:minmax(120px,170px) 72px 1fr;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.metric:first-of-type{border-top:0}
.mname{background:none;border:0;padding:0;text-align:left;cursor:pointer;font-weight:500;display:flex;align-items:center;gap:6px}
.mname .i{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1px solid var(--soft);font-size:.7rem;color:var(--soft);flex:none}
.mval{font-weight:700;font-size:1.1rem;text-align:right}
.pbar{position:relative;height:28px;display:flex;align-items:center;gap:10px}
.track{position:relative;flex:1;height:6px;background:var(--track);border-radius:3px}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.bub{position:absolute;top:50%;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:.75rem;font-weight:700;border:2px solid var(--surface)}
.ptxt{width:68px;font-size:.8rem;color:var(--soft);text-align:right;flex:none}
.neutral{font-size:.85rem;color:var(--soft)}
.explain{grid-column:1/-1;background:var(--chip);border-radius:4px;padding:10px 14px;font-size:.9rem}
.explain p{margin:0 0 4px}
.explain p:last-child{margin:0}
.legend{display:flex;gap:16px;font-size:.8rem;color:var(--soft);flex-wrap:wrap;margin-top:6px}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.mix{display:grid;grid-template-columns:80px 1fr 48px;gap:10px;align-items:center;font-size:.9rem;padding:4px 0}
.mix .track{height:10px}
.empty{padding:24px 0;color:var(--soft)}
@media (max-width:560px){
  .metric{grid-template-columns:1fr auto;}
  .metric .pbar{grid-column:1/-1}
}

/* compare */
.cmp-pick{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:end}
.cmp-pick label{font-size:.85rem;color:var(--soft);display:block;margin-bottom:4px}
.cmp-pick select{width:100%;padding:10px;border:1px solid var(--line);border-radius:4px;background:var(--surface)}
.vs{font-size:1.4rem;padding-bottom:8px}
.ctable{width:100%;border-collapse:collapse;margin-top:16px}
.ctable th,.ctable td{padding:10px 8px;border-top:1px solid var(--line);text-align:center}
.ctable th[scope="row"]{text-align:center;font-weight:500;color:var(--soft)}
.ctable thead th{border-top:0;font-size:1.1rem}
.win{font-weight:700;color:var(--seam)}
.win::after{content:" ▲";font-size:.7em}
.summary{margin-top:16px;padding:14px 16px;border-left:4px solid var(--seam);background:var(--chip);border-radius:0 4px 4px 0}

/* games */
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.gcard{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.gcard:hover{border-color:var(--ink)}
.gcard .display{font-size:1.35rem}
.gcard .t{font-size:.8rem;color:var(--soft)}
.banner{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px;border:2px solid var(--ink);border-radius:6px;margin-bottom:16px;background:var(--surface)}
.back{background:none;border:0;padding:0;margin-bottom:12px;cursor:pointer;color:var(--soft)}
.duel{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:stretch;margin:16px 0}
.pcard{border:2px solid var(--line);border-radius:6px;padding:16px;background:var(--surface);text-align:center}
.pcard .display{font-size:1.6rem;line-height:1.2}
.pcard .big{font-size:2.2rem;font-weight:700;margin-top:8px}
.choice{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.result{margin-top:14px;padding:12px 16px;border-radius:4px;background:var(--chip)}
.ok{color:var(--field);font-weight:700}
.no{color:var(--seam);font-weight:700}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:14px}
.opt{padding:12px;border:1px solid var(--line);border-radius:4px;background:var(--surface);cursor:pointer;text-align:left}
.opt[data-state="wrong"]{border-color:var(--seam);text-decoration:line-through;color:var(--soft)}
.opt[data-state="right"]{border-color:var(--field);border-width:2px;font-weight:700}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:4px;padding:10px;text-align:center;background:var(--surface)}
.stat b{display:block;font-size:1.3rem}
.stat span{font-size:.8rem;color:var(--soft)}
.hints{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.q{border-top:1px solid var(--line);padding:14px 0}
.q:first-child{border-top:0}
.qpick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.qpick button{padding:10px;border:1px solid var(--line);border-radius:4px;background:var(--surface);cursor:pointer}
.qpick button[aria-pressed="true"]{border:2px solid var(--ink);font-weight:700;background:var(--chip)}
.board{list-style:none;margin:0;padding:0}
.board li{display:grid;grid-template-columns:2.5ch 1fr auto;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.board li.me{font-weight:700;color:var(--seam)}
.tag{font-size:.75rem;padding:1px 6px;border-radius:3px;border:1px solid currentColor;margin-left:6px}
@media (max-width:560px){
  .cmp-pick,.duel{grid-template-columns:1fr}
  .vs{text-align:center;padding:0}
}
.sub{font-size:.95rem;margin:22px 0 4px}
.sub small{font-weight:400;color:var(--soft);margin-left:8px;font-size:.8rem}
.rt{display:grid;grid-template-columns:90px 32px 1fr 88px;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.scale{position:relative;display:grid;grid-template-columns:repeat(12,1fr);gap:2px;height:14px}
.scale i{background:var(--track);border-radius:2px}
.scale i.on{background:var(--ink)}
.scale::after{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;border-left:2px dashed var(--seam)}
@media (max-width:560px){.rt{grid-template-columns:80px 30px 1fr}.rt .w{grid-column:1/-1;margin-top:-6px;font-size:.85rem}}
/* community */
.comm{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px;align-items:start}
@media (max-width:820px){.comm{grid-template-columns:1fr}}
.composer textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:4px;background:var(--surface);resize:vertical;line-height:1.5}
.modmsg{font-size:.85rem;margin-top:6px;min-height:0}
.modmsg.block{color:var(--seam);padding:8px 10px;border:1px solid var(--seam);border-radius:4px}
.modmsg.mild{color:var(--warn)}
.tagrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.tagrow .search input{padding:7px 10px;font-size:.9rem;border-width:1px}
.chip.small{padding:3px 10px;font-size:.85rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.previews{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pv{position:relative;width:96px;height:96px;border-radius:4px;overflow:hidden;border:1px solid var(--line);background:var(--chip)}
.pv img,.pv video{width:100%;height:100%;object-fit:cover}
.pv .kind{position:absolute;left:4px;bottom:4px;font-size:.7rem;background:rgba(0,0,0,.65);color:#fff;padding:1px 6px;border-radius:3px}
.pv button{position:absolute;right:4px;top:4px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;cursor:pointer;font-size:.7rem}
.crow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
label.btn{display:inline-block}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 10px}
.post{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:12px}
.ph2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.9rem}
.av{width:28px;height:28px;border-radius:50%;object-fit:cover}
.av.ph3{display:inline-block;background:var(--chip);border:1px solid var(--line)}
.ptext{margin:10px 0 0;white-space:pre-wrap;word-break:break-word}
.mgrid{display:grid;gap:4px;margin-top:10px;border-radius:4px;overflow:hidden}
.mgrid.n2,.mgrid.n3,.mgrid.n4{grid-template-columns:1fr 1fr}
.mgrid img,.mgrid video{width:100%;max-height:420px;object-fit:cover;background:#000;display:block}
.mgrid.n1 img,.mgrid.n1 video{object-fit:contain}
.mph{padding:30px;text-align:center;background:var(--chip);color:var(--soft);font-size:.85rem}
.ptags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.pact{display:flex;gap:6px;margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.pact button{background:none;border:1px solid var(--line);border-radius:4px;padding:4px 12px;cursor:pointer;font-size:.85rem;color:var(--soft)}
.pact button[aria-pressed="true"]{color:var(--seam);border-color:var(--seam);font-weight:700}
.pact button:disabled{opacity:.45;cursor:default}
.linkbtn{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;cursor:pointer}
.mini{border-top:1px solid var(--line);padding:10px 0;font-size:.92rem;display:flex;flex-direction:column;gap:2px}
.bbwho{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.who{border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:2px;background:var(--surface)}
.who .display{font-size:1.4rem;line-height:1.2}
.kv{display:grid;grid-template-columns:1fr auto;gap:0 10px;border-top:1px solid var(--line);padding-top:6px;margin-top:6px;font-size:.9rem}
.kv small{grid-column:1/-1;color:var(--soft);font-size:.78rem}
.brk{width:100%;border-collapse:collapse;margin:10px 0 6px}
.brk th,.brk td{padding:6px 4px;border-top:1px solid var(--line);font-weight:400;text-align:left}
.brk td{text-align:right;font-weight:700;white-space:nowrap}
.brk small{display:block;color:var(--soft);font-size:.78rem}
.brk .tot th,.brk .tot td{font-weight:700;border-top:2px solid var(--ink)}
@media (max-width:560px){.bbwho{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){
  .fill{transition:width .5s ease}
  .bub{transition:left .5s ease}
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand display">세이버 노트<small>데모</small></div>
    <nav aria-label="주요 메뉴">
      <button data-nav="home">선수</button>
      <button data-nav="compare">비교</button>
      <button data-nav="games">미니게임</button>
      <button data-nav="community">커뮤니티</button>
    </nav>
  </div>
</header>
<p class="notice">모든 선수, 팀, 기록은 화면 구현을 보여 주기 위해 만든 가상 데이터입니다. 실제 서비스에서는 이 자리에 스탯티즈 기준으로 계산한 실제 기록이 들어갑니다. 커뮤니티 글은 실제로 저장돼요.</p>
<main id="app"></main>

<script>
/* ---------- 가상 리그 데이터 생성 (시드 고정: 열 때마다 같은 선수) ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=mulberry32(20261017);
const gauss=(rand)=>{let u=0,v=0;while(!u)u=rand();while(!v)v=rand();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
const rn=()=>gauss(R);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const pickR=(arr,rand=Math.random)=>arr[Math.floor(rand()*arr.length)];

const TEAMS=['한빛 수달스','태백 산양스','청운 해오라기스','금강 반딧불스','남해 돌고래스','북악 부엉이스'];
const SUR=['김','이','박','최','정','강','조','윤','장','임','한','오','서','신','권','황','안','송','류','홍','배','노','하','문'];
const GIV=['도윤','하준','서진','지호','은찬','태오','시우','민재','건우','유찬','도현','준서','현우','지훈','승민','재원','한결','우진','성호','태민','윤호','정우','다온','이안','로운','주원','선우','하람','지성','동하','민혁','규빈','세찬','찬영','영재','태경','진혁','상훈','우석','기현'];
const used=new Set();
function mkName(){let n;do{n=pickR(SUR,R)+pickR(GIV,R)}while(used.has(n));used.add(n);return n}

const POS=['C','1B','2B','3B','SS','LF','CF','RF','DH'];
const POSK={C:'포수','1B':'1루수','2B':'2루수','3B':'3루수',SS:'유격수',LF:'좌익수',CF:'중견수',RF:'우익수',DH:'지명타자',SP:'선발투수',RP:'불펜투수'};
const POSADJ={C:12.5,SS:7.5,'2B':2.5,'3B':2.5,CF:2.5,LF:-7.5,RF:-7.5,'1B':-12.5,DH:-17.5};
const players=[];let pid=1;

function mkHitter(team,pos,regular){
  const tP=rn(),tE=rn(),tC=rn(),tS=rn(),tD=rn();
  const spd=tS+(['SS','CF','2B'].includes(pos)?.6:0)-(['C','1B','DH'].includes(pos)?.6:0);
  const pw=tP+(['1B','DH','LF','RF'].includes(pos)?.5:0)-(['SS','2B','C'].includes(pos)?.4:0);
  const PA=regular?Math.round(clamp(540+rn()*55,430,640)):Math.round(120+R()*170);
  const rates={bb:clamp(.085+.022*tE,.03,.17),k:clamp(.185-.03*tC+.012*pw,.09,.30),hr:clamp(.026+.013*pw,.003,.07),hbp:.011,
    babip:clamp(.300+.009*tC+.012*spd+.013*rn(),.25,.37),d2:clamp(.21+.03*pw,.12,.32),d3:clamp(.015+.012*spd,0,.06)};
  const BB=Math.round(PA*rates.bb),HBP=Math.round(PA*rates.hbp),SO=Math.round(PA*rates.k),HR=Math.round(PA*rates.hr);
  const BIP=PA-BB-HBP-SO-HR,Hb=Math.round(BIP*rates.babip);

function mkPitcher(team,sp){
  const tS=rn(),tC=rn(),tH=rn()*.6;

  const SO=Math.round(TBF*rates.k),BB=Math.round(TBF*rates.bb),HR=Math.round(TBF*rates.hr),HBP=Math.round(TBF*rates.hbp);

  const mix=[['포심',fb],...others.map((n,i)=>[n,(1-fb)*w[i]/ws])].sort((a,b)=>b[1]-a[1]);
  players.push({id:pid++,type:'P',name:mkName(),team,pos:sp?'SP':'RP',age:21+Math.floor(R()*15),outs,IP,TBF,SO,BB,HR,HBP,H,raw,rates,

    whiff:clamp(.24+.045*tS+.01*rn(),.14,.38),mix});
}

/* 수비: DRS·UZR(구성 요소 합)·OAA·ZR(OOTP식) + 전통 기록 + 20~80 능력치 */
const POSF={C:{rng:.2,tc:8.2,err:.5,dp:0},'1B':{rng:.5,tc:9,err:.5,dp:.1},'2B':{rng:1,tc:4.8,err:1,dp:1},'3B':{rng:1,tc:2.8,err:1.4,dp:.35},SS:{rng:1.3,tc:4.5,err:1.3,dp:.95},LF:{rng:.8,tc:2.1,err:.6,dp:0},CF:{rng:1.3,tc:2.7,err:.6,dp:0},RF:{rng:.8,tc:2.2,err:.6,dp:0}};
function defGen(p){
  const none={inn:null,drs:null,uzr:null,oaa:null,zr:null,rngR:null,errR:null,dpR:null,armR:null,frmR:null,blkR:null,csR:null,csp:null};
  if(p.pos==='DH'){Object.assign(p,none);return}
  const f=POSF[p.pos],t=p.dt,C=p.pos==='C',IF=['1B','2B','3B','SS'].includes(p.pos),OF=['LF','CF','RF'].includes(p.pos);
  const inn=p.regular?clamp(p.PA*2.1,900,1300):p.PA*1.6,k=inn/1200;p.inn=inn;
  p.rngR=(t.rng*4+rn()*1.5)*f.rng*k;
  p.errR=(t.hands*1.2+rn()*.6)*f.err*k;
  p.dpR=IF?(t.dp*1.6+rn()*.5)*f.dp*k:null;
  p.armR=OF?(t.arm*2.2+rn()*.8)*k:null;
  if(C){p.frmR=(t.frame*1.5+rn()*.5)*k;p.blkR=(t.block*1.5+rn()*.5)*k;p.csp=clamp(.25+.06*t.carm+.03*rn(),.1,.5);p.csR=(p.csp-.25)*80*k*.6}
  else{p.frmR=p.blkR=p.csp=p.csR=null}
  p.uzr=p.rngR+p.errR+(p.dpR||0)+(p.armR||0)+(p.frmR||0)+(p.blkR||0)+(p.csR||0);
  p.drs=Math.round(p.uzr+rn()*1.8);
  p.oaa=C?null:Math.round(p.rngR/.85+rn());
  p.zr=p.rngR+p.errR+(p.dpR||0)+(p.armR||0)+rn()*1.2;
  const tc=Math.round(inn/9*f.tc*(1+.06*t.rng));
  p.TC=tc;p.E=Math.max(0,Math.round(tc*clamp(.018-.006*t.hands,.003,.05)*f.err));p.fpct=(tc-p.E)/tc;p.rf9=(tc-p.E)*9/inn;
  p.DP=IF?Math.round(inn/9*f.dp*.9*(1+.08*t.dp)):null;p.A_OF=OF?Math.max(0,Math.round(k*(5+2*t.arm))):null;
  const g=x=>clamp(Math.round((50+10*x)/5)*5,20,80);
  p.rt=C?[['포수 수비',g(t.block*.5+t.frame*.5)],['블로킹',g(t.block)],['프레이밍',g(t.frame)],['송구 강도',g(t.carm)]]
    :[['수비 범위',g(t.rng)],['포구',g(t.hands)],['송구 강도',g(t.arm)]].concat(IF?[['병살 처리',g(t.dp)]]:[]);
}
const H_=players.filter(p=>p.type==='H'),P_=players.filter(p=>p.type==='P');
const W={bb:.69,hbp:.72,s1:.89,d2:1.27,d3:1.62,hr:2.10},WSCALE=1.2,LG_RPA=.118;
const wobaNum=p=>W.bb*p.BB+W.hbp*p.HBP+W.s1*p.S1+W.d2*p.D2+W.d3*p.D3+W.hr*p.HR;
const LG={};
LG.woba=H_.reduce((a,p)=>a+wobaNum(p),0)/H_.reduce((a,p)=>a+p.PA,0);
H_.forEach(p=>{
  p.AB=p.PA-p.BB-p.HBP;p.H=p.S1+p.D2+p.D3+p.HR;
  p.avg=p.H/p.AB;p.obp=(p.H+p.BB+p.HBP)/p.PA;p.slg=(p.S1+2*p.D2+3*p.D3+4*p.HR)/p.AB;p.ops=p.obp+p.slg;
  p.woba=wobaNum(p)/p.PA;p.wraa=(p.woba-LG.woba)/WSCALE*p.PA;
  p.wrcp=((p.wraa/p.PA)+LG_RPA)/LG_RPA*100;
  p.babip=(p.H-p.HR)/(p.AB-p.SO-p.HR);p.bbp=p.BB/p.PA;p.kp=p.SO/p.PA;p.hr=p.HR;
  defGen(p);
  p.xba=clamp(p.avg+.015*rn(),.18,.36);
  const onFirst=p.S1+p.BB+p.HBP,att=Math.round(onFirst*p.sbRate);
  p.SB=Math.round(att*p.sbSucc);p.CS=att-p.SB;p.sb=p.SB;p.sbp=att?p.SB/att:null;p.onFirst=onFirst;
  p.h2f=clamp(4.30+(8.2-p.sprint)*.5+.04*rn(),3.9,4.9);
});
/* 주루: 도루 득점(wSB) + 추가 진루 득점 = 주루 득점(BsR) */
const RUN_SB=.2,RUN_CS=-.41;
LG.wsb=H_.reduce((a,p)=>a+RUN_SB*p.SB+RUN_CS*p.CS,0)/H_.reduce((a,p)=>a+p.onFirst,0);
LG.xbt=H_.reduce((a,p)=>a+p.xbt*p.PA,0)/H_.reduce((a,p)=>a+p.PA,0);
H_.forEach(p=>{
  p.wsb=RUN_SB*p.SB+RUN_CS*p.CS-LG.wsb*p.onFirst;
  p.ubr=(p.xbt-LG.xbt)*(p.S1+p.BB)*.35*.35;
  p.bsr=p.wsb+p.ubr;
  p.WAR=(p.wraa+POSADJ[p.pos]*p.PA/600+(p.uzr||0)+p.bsr+20*p.PA/600)/10;
});
const sumIP=P_.reduce((a,p)=>a+p.IP,0);
LG.era=9*P_.reduce((a,p)=>a+p.ER,0)/sumIP;
LG.cfip=LG.era-P_.reduce((a,p)=>a+p.raw*p.IP,0)/sumIP;
P_.forEach(p=>{
  p.era=9*p.ER/p.IP;p.fip=p.raw+LG.cfip;p.whip=(p.BB+p.H)/p.IP;p.pk=p.SO/p.TBF;p.pbb=p.BB/p.TBF;
  p.WAR=(LG.era+1.4-p.fip)*p.IP/9/10;
});

/* 기대 타율 간이 모델 (타구 속도 km/h, 발사각 °) */
function xbaOf(ev,la){
  let p;
  if(la<-10)p=.10+(ev-120)/60*.25;
  else if(la<8)p=.18+(ev-110)/70*.45;
  else if(la<=32)p=.30+(ev-110)/60*.62;
  else if(la<=50)p=ev>160?.45:.05+(ev-110)/50*.25;
  else p=.02;
  if(ev>=158&&la>=22&&la<=35)p=Math.max(p,.9);
  return clamp(p,.01,.97);
}
function battedBalls(p){
  const r=mulberry32(p.id*977+3),out=[];
  for(let i=0;i<40;i++){const ev=clamp(p.ev+gauss(r)*13,90,190),la=clamp(p.la+gauss(r)*22,-35,70);out.push({ev,la,hit:r()<xbaOf(ev,la)})}
  return out;
}

  pbb:{n:'볼넷 허용 비율',d:1,pct:true,hi:false,desc:'상대한 타자 중 볼넷을 내준 비율이에요. 낮을수록 좋아요.',scale:'6% 이하 좋음, 10% 이상 아쉬움'},

  spin:{n:'직구 회전수',d:0,unit:' rpm',hi:true,desc:'직구가 1분에 도는 횟수예요. 많을수록 공이 덜 떨어져 떠오르는 듯 보여요.',scale:'2,450 rpm 이상 좋음'},

};
const poolH=H_.filter(p=>p.PA>=300),poolP=P_;
const poolOf=p=>p.type==='H'?poolH:poolP;
function fmt(k,v){
  if(v===null||v===undefined)return '-';
  const m=M[k];
  if(m.pct)return (v*100).toFixed(m.d)+'%';
  if(m.rate){const s=v.toFixed(3);return v<1?s.replace(/^0/,''):s}
  let s=k==='spin'?Math.round(v).toLocaleString('ko-KR'):v.toFixed(m.d);
  if(m.sign&&v>0)s='+'+s;
  return s+(m.unit||'');
}
function pctl(p,k){
  const v=p[k];if(v===null||v===undefined)return null;
  const vals=poolOf(p).map(q=>q[k]).filter(x=>x!==null);
  let below=0,eq=0;vals.forEach(x=>{if(x<v)below++;else if(x===v)eq++});
  let r=(below+eq/2)/vals.length*100;if(!M[k].hi)r=100-r;
  return clamp(Math.round(r),1,99);
}
function lgAvg(type,k){const pool=type==='H'?poolH:poolP;const v=pool.map(p=>p[k]).filter(x=>x!==null);return v.reduce((a,b)=>a+b,0)/v.length}
function pctColor(p){
  const blue=[54,97,173],grey=[160,164,170],red=[216,33,41],t=p/100;
  const [a,b,u]=t<.5?[blue,grey,t*2]:[grey,red,(t-.5)*2];
  return 'rgb('+a.map((v,i)=>Math.round(v+(b[i]-v)*u)).join(',')+')';
}
const ipFmt=outs=>Math.floor(outs/3)+(outs%3?['','⅓','⅔'][outs%3]:'')+'이닝';

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function metricRow(p,k){
  const m=M[k],v=p[k],key=p.id+k,open=S.open===key;
  let bar;
  if(m.neutral){bar=`<div class="neutral">리그 평균 ${fmt(k,lgAvg(p.type,k))}와 비교해 보세요</div>`}
  else if(v===null){bar=`<div class="neutral">${m.none||'기록이 없어요'}</div>`}
  else{const c=pctl(p,k),col=pctColor(c);
    bar=`<div class="pbar" role="img" aria-label="리그 상위 ${100-c}%"><div class="track"><div class="fill" style="width:${c}%;background:${col}"></div><div class="bub" style="left:${c}%;background:${col}">${c}</div></div><span class="ptxt">상위 ${Math.max(1,100-c)}%</span></div>`}
  return `<div class="metric">
    <button class="mname" data-open="${key}" aria-expanded="${open}"><span>${m.n}</span><span class="i" aria-hidden="true">i</span></button>
    <div class="mval">${fmt(k,v)}</div>${bar}
    ${open?`<div class="explain"><p>${m.desc}</p><p class="muted">기준: ${m.scale}. 리그 평균 ${fmt(k,lgAvg(p.type,k))}</p></div>`:''}
  </div>`;
}
function defTab(p){
  if(p.pos==='DH')return `<p class="empty">지명타자는 수비에 나서지 않아 수비 지표가 없어요. 대신 WAR 계산에서 포지션 보정으로 감점돼요.</p>`;
  const C=p.pos==='C',IF=['1B','2B','3B','SS'].includes(p.pos);
  const rows=ks=>ks.filter(k=>p[k]!==null&&p[k]!==undefined).map(k=>metricRow(p,k)).join('');
  const word=r=>r>=80?'최고 수준':r>=70?'매우 뛰어남':r>=60?'뛰어남':r>=55?'평균 이상':r>=50?'평균':r>=45?'평균 이하':r>=40?'약점':'큰 약점';
  const trad=[['수비 이닝',Math.round(p.inn).toLocaleString('ko-KR')],['수비율',fmt('fpct',p.fpct)],['실책',p.E],['레인지 팩터',p.rf9.toFixed(2)]]
    .concat(C?[['도루 저지율',fmt('csp',p.csp)]]:IF?[['병살 처리',p.DP]]:[['보살',p.A_OF]]);
  return `<h3 class="sub">종합 수비 지표<small>평균 수비수 대비 몇 점을 더 막았는지</small></h3>${rows(['drs','uzr','oaa','zr'])}
  <h3 class="sub">세부 구성<small>UZR을 이루는 점수</small></h3>${rows(C?['frmR','blkR','csR','csp','errR']:['rngR','errR','dpR','armR'])}
  <h3 class="sub">전통 기록</h3><div class="statgrid">${trad.map(([l,v])=>`<div class="stat"><b>${v}</b><span>${l}</span></div>`).join('')}</div>
  <h3 class="sub">스카우팅 능력치<small>OOTP식 20~80 등급, 50이 평균</small></h3>
  ${p.rt.map(([l,r])=>`<div class="rt"><span>${l}</span><b>${r}</b><div class="scale" role="img" aria-label="${l} ${r}점, ${word(r)}">${Array.from({length:12},(_,i)=>`<i class="${i<(r-20)/5?'on':''}"></i>`).join('')}</div><span class="w muted">${word(r)}</span></div>`).join('')}
  <p class="muted" style="font-size:.85rem;margin:12px 0 0">수비 지표는 같은 선수라도 계산 방식(DRS, UZR, OAA, ZR)에 따라 값이 달라요. 능력치는 기록이 아니라 스카우트 관점의 등급이고, 빨간 점선이 리그 평균(50)이에요. 실서비스에서는 기록을 바탕으로 추정한 등급이 들어가요.</p>`;
}

function vCompare(){
  const opts=sel=>`<option value="">선수 선택</option><optgroup label="타자">${H_.map(p=>`<option value="${p.id}" ${p.id===sel?'selected':''}>${esc(p.name)} (${esc(p.team)}, ${POSK[p.pos]})</option>`).join('')}</optgroup><optgroup label="투수">${P_.map(p=>`<option value="${p.id}" ${p.id===sel?'selected':''}>${esc(p.name)} (${esc(p.team)}, ${POSK[p.pos]})</option>`).join('')}</optgroup>`;
  const A=S.cmpA&&byId(S.cmpA),B=S.cmpB&&byId(S.cmpB);
  let body='<p class="empty">두 선수를 고르면 같은 지표를 나란히 비교해 드려요.</p>';
  if(A&&B&&A.type!==B.type)body='<p class="empty">타자는 타자끼리, 투수는 투수끼리 비교할 수 있어요. 한 선수를 다시 골라 주세요.</p>';
  else if(A&&B&&A.id===B.id)body='<p class="empty">서로 다른 두 선수를 골라 주세요.</p>';
  else if(A&&B){
    const keys=A.type==='H'?['WAR','wrcp','ops','woba','bsr','drs','bbp','kp']:['WAR','era','fip','whip','pk','pbb'];
    let aw=0,bw=0;const reasons=[];
    const rows=keys.map(k=>{const m=M[k],a=A[k],b=B[k];let wa=false,wb=false;
      if(a!==null&&b!==null&&a!==b){wa=m.hi?a>b:a<b;wb=!wa}
      if(wa){aw++;reasons.push(`${m.n} ${fmt(k,a)} 대 ${fmt(k,b)}: ${A.name}`)}if(wb){bw++;reasons.push(`${m.n} ${fmt(k,a)} 대 ${fmt(k,b)}: ${B.name}`)}
      return `<tr><td class="${wa?'win':''}">${fmt(k,a)}</td><th scope="row">${m.n}</th><td class="${wb?'win':''}">${fmt(k,b)}</td></tr>`}).join('');
    const lead=aw===bw?`지표 ${keys.length}개 중 두 선수가 ${aw}개씩 앞서요.`:`지표 ${keys.length}개 중 ${aw>bw?A.name:B.name} 선수가 ${Math.max(aw,bw)}개 우세해요.`;
    body=`<table class="ctable"><thead><tr><th class="display">${esc(A.name)}</th><th></th><th class="display">${esc(B.name)}</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="summary"><b>${lead}</b><div class="muted" style="font-size:.9rem;margin-top:6px">근거: ${reasons.map(esc).join(' / ')}</div></div>`;
  }
  app.innerHTML=`<div class="panel"><h1 class="display" style="margin:0 0 16px;font-size:2rem">선수 2명 비교</h1>
    <div class="cmp-pick"><div><label for="ca">왼쪽 선수</label><select id="ca">${opts(S.cmpA)}</select></div><div class="vs display">VS</div><div><label for="cb">오른쪽 선수</label><select id="cb">${opts(S.cmpB)}</select></div></div>
    ${body}<p class="muted" style="font-size:.85rem;margin:14px 0 0">▲ 표시와 빨간 숫자가 그 지표에서 앞서는 쪽이에요. ERA, FIP, WHIP, 삼진 비율, 볼넷 허용 비율은 낮을수록 앞섭니다.</p></div>`;
  document.getElementById('ca').onchange=e=>{S.cmpA=+e.target.value||null;render()};
  document.getElementById('cb').onchange=e=>{S.cmpB=+e.target.value||null;render()};
}

let CH=null;

function simHitterWeek(p){
  const pa=Math.random()<.15?4+Math.floor(Math.random()*6):20+Math.floor(Math.random()*9);const r=p.rates;
  let bb=0,hbp=0,s1=0,d2=0,d3=0,hr=0;
  for(let i=0;i<pa;i++){let x=Math.random();
    if((x-=r.bb)<0)bb++;else if((x-=r.hbp)<0)hbp++;else if((x-=r.k)<0){}else if((x-=r.hr)<0)hr++;
    else if(Math.random()<r.babip){const y=Math.random();if(y<r.d3)d3++;else if(y<r.d3+r.d2)d2++;else s1++}}
  const woba=(W.bb*bb+W.hbp*hbp+W.s1*s1+W.d2*d2+W.d3*d3+W.hr*hr)/pa;
  return {pa,val:(((woba-LG.woba)/WSCALE)+LG_RPA)/LG_RPA*100,valid:pa>=10};
}
function simPitcherWeek(p){
  const u=Math.random(),gs=u<.12?0:u<.3?2:1;let outs=0,k=0,bb=0,hr=0;const r=p.rates;
  for(let g=0;g<gs;g++){const o=15+Math.floor(Math.random()*7);outs+=o;const tbf=Math.round(o/3*4.25);
    for(let i=0;i<tbf;i++){let x=Math.random();if((x-=r.k)<0)k++;else if((x-=r.bb+r.hbp)<0)bb++;else if((x-=r.hr)<0)hr++}}
  return {gs,outs,val:gs?(13*hr+3*bb-2*k)/(outs/3)+LG.cfip:null,valid:gs>0};
}
function chScore(){
  CH.week=CH.qs.map((q,i)=>{
    const sa=q.kind==='H'?simHitterWeek(q.a):simPitcherWeek(q.a),sb=q.kind==='H'?simHitterWeek(q.b):simPitcherWeek(q.b);
    const valid=sa.valid&&sb.valid;let win=null;
    if(valid)win=q.kind==='H'?(sa.val>=sb.val?'a':'b'):(sa.val<=sb.val?'a':'b');

let BB=null;
const DIR={L:{n:'좌측',deg:-30},C:{n:'가운데',deg:0},R:{n:'우측',deg:30}};
const FPOS={C:[100,166],'1B':[140,117],'2B':[121,99],SS:[80,99],'3B':[60,117],LF:[46,55],CF:[100,30],RF:[154,55]};
function fielderFor(team,la,dir){
  let pos;
  if(la<10)pos=dir==='L'?pickR(['3B','SS']):dir==='C'?pickR(['SS','2B']):pickR(['2B','1B']);
  else if(la>50)pos=dir==='L'?'3B':dir==='C'?'SS':'1B';
  else pos=dir==='L'?'LF':dir==='C'?'CF':'RF';
  return H_.find(p=>p.team===team&&p.pos===pos&&p.regular)||H_.find(p=>p.team===team&&p.pos===pos);
}
function bbBall(){
  const batter=pickR(regulars()),team=pickR(TEAMS.filter(t=>t!==batter.team));
  const ev=95+Math.random()*90,la=-25+Math.random()*80,dir=pickR(['L','C','R']);
  const f=fielderFor(team,la,dir),base=xbaOf(ev,la);
  const hrZone=ev>=158&&la>=22&&la<=35,popup=la>50;
  const sz=(batter.sprint-8.2)/.3;let spd=0,def=0;
  if(!hrZone&&!popup){spd=la<10?.05*sz*(ev<150?1:.5):.015*sz;def=-.04*((f.oaa||0)/5)}
  const p=clamp(base+spd+def,.01,.97),hit=Math.random()<p;
  let type=null,extra=false;
  if(hit){
    if(hrZone)type='홈런';
    else if(la<10)type=ev<135?'내야 안타':'단타';
    else if(ev>=148){const r=Math.random();if(batter.sprint>8.6&&r<.08){type='3루타';extra=true}else if(r<.3+.5*(batter.xbt-.45)){type='2루타';extra=batter.xbt>LG.xbt}else type='단타'}
    else type='단타';
  }
  return {ev,la,dir,deg:DIR[dir].deg+(Math.random()-.5)*20,batter,team,f,base,spd,def,p,hit,type,extra,hrZone,popup};
}
const dl=v=>(v>=0?'+':'−')+Math.abs(v).toFixed(3).replace(/^0/,'');
function bbWhy(b){

/* ---------- 커뮤니티 (공유 저장소 db + 업로드 assets + 사용자 user) ---------- */
const COMM={mode:'loading',posts:[],db:null,assets:null,user:null,me:null,canEditAll:false,profiles:{},
  draft:{text:'',players:[],files:[]},filter:{player:null,media:false},busy:false,lastPost:0,readOnly:false,focus:false};

/* 작성 제한: 규칙 기반 표현 필터 */
const MOD={
  block:[
    ['욕설',['씨발','씨바','씨빨','시발','ㅅㅂ','ㅆㅂ','tlqkf','썅','병신','븅신','ㅂㅅ','qudtls','개새끼','개새기','개색기','개세끼','개색끼','좆','존만','지랄','ㅈㄹ','염병','엠창','니애미','느금마','애미뒤','애비뒤']],
    ['혐오·비하',['장애인새끼','애자새끼','틀딱','한남충','김치녀','쪽바리','짱깨','급식충','맘충']],
    ['위협',['죽여버','찾아가서패','칼로찔','죽어라','뒤져라','뒤지고싶']]
  ],
  mild:['존나','졸라','ㅈㄴ','꺼져','닥쳐','발암','개못']
};
const normTxt=s=>s.toLowerCase().replace(/[\s\d_.,!?~\-*^'"`·…|\\/()[\]{}<>@#$%&+=:;]/g,'');
function moderate(text){
  const n=normTxt(text),reasons=new Set(),found=new Set();
  MOD.block.forEach(([cat,ws])=>ws.forEach(w=>{if(n.includes(w)){reasons.add(cat);found.add(w)}}));
  if(/01[016789][-\s.]?\d{3,4}[-\s.]?\d{4}/.test(text)){reasons.add('개인정보(전화번호)');found.add('전화번호')}
  if(reasons.size)return {level:'block',reasons:[...reasons],found:[...found]};
  const mild=MOD.mild.filter(w=>n.includes(w));
  if(mild.length)return {level:'mild',found:mild};
  return {level:'ok'};
}
function maskMild(text){let t=text;MOD.mild.forEach(w=>{t=t.split(w).join('●'.repeat(w.length))});return t}

const MEDIA_TYPES={'image/png':'사진','image/jpeg':'사진','image/webp':'사진','image/gif':'움짤','video/mp4':'영상','video/webm':'영상'};
const mediaSrc=m=>m.url||('/_blob/'+m.id);
const ago=ms=>{const s=(Date.now()-ms)/1000;if(s<60)return '방금';if(s<3600)return Math.floor(s/60)+'분 전';if(s<86400)return Math.floor(s/3600)+'시간 전';return Math.floor(s/86400)+'일 전'};
const related=p=>COMM.posts.filter(x=>(x.players||[]).includes(p.id)||(x.text||'').includes(p.name));
const authorName=x=>x.seed?'데모 게시글':x.authorId==='local'?'나':(COMM.profiles[x.authorId]&&COMM.profiles[x.authorId].name)||(COMM.me&&x.authorId===COMM.me.id?(COMM.me.name||'나'):'팬');
const authorAvatar=x=>x.authorId&&COMM.profiles[x.authorId]?COMM.profiles[x.authorId].avatarUrl:null;

async function initComm(){
  const C=window.claude;
  if(!C||typeof C.use!=='function'){COMM.mode='local';return commRefresh()}
  const [db,user,assets]=await Promise.all([C.use('db'),C.use('user'),C.use('assets')]);
  COMM.assets=assets;COMM.user=user;
  if(user){try{COMM.me=await user.me();COMM.canEditAll=await user.canEdit();const w=await user.can('data.write');if(w===false)COMM.readOnly=true}catch(e){}}
  if(!db){COMM.mode='local';return commRefresh()}
  COMM.db=db;COMM.mode='live';commRefresh();
  db.collection('posts').orderBy('createdAt','desc').limit(300).onSnapshot(async s=>{
    COMM.posts=s.docs.map(d=>Object.assign({id:d.id},d.data()));
    const ids=[...new Set(COMM.posts.map(x=>x.authorId).filter(x=>x&&x!=='local'))].filter(id=>!COMM.profiles[id]);
    if(ids.length&&COMM.user){try{Object.assign(COMM.profiles,await COMM.user.profiles(ids))}catch(e){}}
    commRefresh();
  },()=>{COMM.mode='local';commRefresh()});
}
function commRefresh(){
  if(S.view==='community'){renderFeed();renderSide();renderComposerState()}
  if(S.view==='player'){const p=byId(S.player);if(p)renderPlayerComm(p)}
}

function renderTags(){const el=document.getElementById('ctags');if(!el)return;
  el.innerHTML=COMM.draft.players.map(id=>{const p=byId(id);return `<button class="chip small" data-rm="${id}" aria-label="${esc(p.name)} 태그 빼기">${esc(p.name)} ✕</button>`}).join('');
  el.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{COMM.draft.players=COMM.draft.players.filter(x=>x!==+b.dataset.rm);renderTags()})}
function addFiles(list){
  const msgs=[];
  list.forEach(f=>{
    if(COMM.draft.files.length>=4){msgs.push('파일은 4개까지 올릴 수 있어요');return}
    if(!MEDIA_TYPES[f.type]){msgs.push(`${f.name}: PNG, JPG, WEBP, GIF, MP4, WEBM 파일만 올릴 수 있어요`);return}
    if(f.size>20*1024*1024){msgs.push(`${f.name}: 20MB를 넘어요. 용량을 줄여서 다시 올려 주세요`);return}
    COMM.draft.files.push({file:f,kind:MEDIA_TYPES[f.type],preview:URL.createObjectURL(f)});
  });
  renderFiles();if(msgs.length)setNote(msgs.join(' / '),true);
}
function renderFiles(){const el=document.getElementById('cfiles');if(!el)return;
  el.innerHTML=COMM.draft.files.map((f,i)=>`<div class="pv">${f.kind==='영상'?`<video src="${f.preview}" muted playsinline></video>`:`<img src="${f.preview}" alt="">`}<span class="kind">${f.kind}</span><button data-rf="${i}" aria-label="파일 빼기">✕</button></div>`).join('');
  el.querySelectorAll('[data-rf]').forEach(b=>b.onclick=()=>{const [r]=COMM.draft.files.splice(+b.dataset.rf,1);URL.revokeObjectURL(r.preview);renderFiles()})}
function renderModMsg(){const el=document.getElementById('cmod');if(!el)return;

  else if(m.level==='mild'){el.className='modmsg mild';el.innerHTML=`거친 표현(${m.found.map(esc).join(', ')})은 게시할 때 ●●로 가려져요.`}

  if(COMM.readOnly)setNote('이 페이지에서는 글을 읽을 수만 있어요.',true);
  renderModMsg();

async function submitPost(){
  const text=COMM.draft.text.trim();const m=moderate(text);
  if(m.level==='block')return renderModMsg();
  if(Date.now()-COMM.lastPost<30000)return setNote('도배 방지를 위해 30초에 한 번만 글을 올릴 수 있어요.',true);
  const masked=m.level==='mild';const finalText=masked?maskMild(text):text;
  const tags=new Set(COMM.draft.players);players.forEach(p=>{if(text.includes(p.name))tags.add(p.id)});
  COMM.busy=true;renderModMsg();setNote('올리는 중이에요…');
  try{
    const media=[];
    for(const f of COMM.draft.files){
      if(COMM.mode==='live'){const r=await COMM.assets.upload(f.file,{type:f.file.type});media.push({id:r.id,kind:f.kind})}
      else media.push({url:f.preview,kind:f.kind});
    }
    const post={authorId:COMM.mode==='live'?(COMM.me&&COMM.me.id)||null:'local',text:finalText,players:[...tags],media,createdAt:Date.now(),likes:[],reports:[],masked};
    if(COMM.mode==='live')await COMM.db.collection('posts').add(post);
    else{COMM.posts.unshift(Object.assign({id:'l'+Date.now()},post))}
    COMM.draft={text:'',players:[],files:[]};COMM.lastPost=Date.now();COMM.busy=false;
    vCommunity();setNote(masked?'게시했어요. 거친 표현 일부는 가려졌어요.':'게시했어요.');
    if(COMM.mode==='local')renderFeed();
  }catch(e){
    COMM.busy=false;renderModMsg();
    const c=e&&e.code;
    setNote(c==='too_large'?'파일이 너무 커서 올리지 못했어요.':c==='unsupported_type'?'지원하지 않는 파일 형식이에요.':c==='quota_exceeded'||c==='quota_or_state'?'저장 공간이 가득 차서 올리지 못했어요. 오래된 글을 지운 뒤 다시 시도해 주세요.':c==='invalid_argument'?'이 페이지에서는 글을 쓸 권한이 없어요.':c==='rate_limited'||c==='resource_exhausted'?'요청이 너무 많아요. 잠시 뒤 다시 올려 주세요.':'올리지 못했어요. 잠시 뒤 다시 시도해 주세요.',true);
    if(c==='invalid_argument'){COMM.readOnly=true;renderModMsg()}
  }
}
function visiblePosts(){

  if(COMM.filter.player){const p=byId(COMM.filter.player);list=related(p)}
  if(COMM.filter.media)list=list.filter(x=>x.media&&x.media.length);

function postHTML(x){

  if(hidden)return `<article class="post"><p class="muted" style="margin:0">신고가 누적돼 가려진 글이에요. <button class="linkbtn" data-reveal="${x.id}">그래도 보기</button></p></article>`;
  return `<article class="post">
    <header class="ph2">${av?`<img class="av" src="${esc(av)}" alt="">`:`<span class="av ph3"></span>`}<b>${esc(authorName(x))}</b><span class="muted">${ago(x.createdAt)}</span>${x.masked?'<span class="tag">일부 가림</span>':''}</header>
    ${x.text?`<p class="ptext">${esc(x.text)}</p>`:''}
    ${x.media&&x.media.length?`<div class="mgrid n${Math.min(x.media.length,4)}">${x.media.map(m=>m.kind==='영상'?`<video src="${esc(mediaSrc(m))}" controls playsinline preload="metadata"></video>`:`<img src="${esc(mediaSrc(m))}" alt="${m.kind}" loading="lazy">`).join('')}</div>`:''}
    ${(x.players||[]).length?`<div class="ptags">${x.players.map(id=>{const p=byId(id);return p?`<button class="chip small" data-goto="${id}">${esc(p.name)}</button>`:''}).join('')}</div>`:''}
    <footer class="pact"><button data-like="${x.id}" aria-pressed="${!!liked}" ${myId?'':'disabled'}>좋아요 ${(x.likes||[]).length}</button>
      <button data-report="${x.id}" ${myId&&!reported&&!mine?'':'disabled'}>${reported?'신고함':'신고'}</button>
      ${canDel&&!x.seed?`<button data-del="${x.id}">삭제</button>`:''}</footer>
  </article>`;
}
function renderFeed(){
  const el=document.getElementById('feed');if(!el)return;
  if(COMM.mode==='loading'){el.innerHTML='<p class="empty">커뮤니티를 불러오는 중이에요.</p>';return}
  const list=visiblePosts();
  el.innerHTML=list.length?list.map(postHTML).join(''):`<p class="empty">${COMM.filter.player?'이 선수 이야기는 아직 없어요. 위에서 첫 글을 남겨 보세요.':'아직 글이 없어요. 첫 글을 남겨 보세요.'}</p>`;
  el.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>openPlayer(+b.dataset.goto));
  el.querySelectorAll('[data-reveal]').forEach(b=>b.onclick=()=>{COMM.revealed=COMM.revealed||{};COMM.revealed[b.dataset.reveal]=true;renderFeed()});
  el.querySelectorAll('[data-like]').forEach(b=>b.onclick=()=>toggleArr(b.dataset.like,'likes'));
  el.querySelectorAll('.mgrid img,.mgrid video').forEach(m=>m.addEventListener('error',()=>{const d=document.createElement('div');d.className='mph';d.textContent='이 파일을 볼 수 없어요';m.replaceWith(d)}));
  const twoStep=(b,label,fn)=>b.onclick=()=>{if(b.dataset.armed){fn()}else{b.dataset.armed='1';b.textContent=label;setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent=b.dataset.orig}},4000)}};
  el.querySelectorAll('[data-report]').forEach(b=>{b.dataset.orig=b.textContent;twoStep(b,'한 번 더 누르면 신고 (3번 쌓이면 가려져요)',()=>toggleArr(b.dataset.report,'reports'))});
  el.querySelectorAll('[data-del]').forEach(b=>{b.dataset.orig=b.textContent;twoStep(b,'한 번 더 누르면 삭제',()=>delPost(b.dataset.del))});
}
async function toggleArr(id,field){
  const x=COMM.posts.find(p=>p.id===id);if(!x)return;
  const myId=COMM.mode==='live'?COMM.me&&COMM.me.id:'local';if(!myId)return;
  const arr=[...(x[field]||[])];const i=arr.indexOf(myId);if(i>=0){if(field==='reports')return;arr.splice(i,1)}else arr.push(myId);
  if(COMM.mode==='live'){try{await COMM.db.doc('posts/'+id).update({[field]:arr})}catch(e){setNote('반영하지 못했어요. 잠시 뒤 다시 시도해 주세요.',true)}}
  else{x[field]=arr;renderFeed()}
}
async function delPost(id){
  const x=COMM.posts.find(p=>p.id===id);
  if(COMM.mode==='live'){
    try{await COMM.db.doc('posts/'+id).delete();if(COMM.assets)for(const m of x.media||[]){try{await COMM.assets.delete(m.id)}catch(e){}}}
    catch(e){setNote('삭제하지 못했어요.',true)}
  }else{COMM.posts=COMM.posts.filter(p=>p.id!==id);renderFeed()}
}
function renderSide(){
  const el=document.getElementById('cside');if(!el)return;
  const cnt={};COMM.posts.filter(x=>Date.now()-x.createdAt<7*86400000).forEach(x=>{const ids=new Set(x.players||[]);players.forEach(p=>{if((x.text||'').includes(p.name))ids.add(p.id)});ids.forEach(id=>cnt[id]=(cnt[id]||0)+1)});
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,5);
  el.innerHTML=`<h2>이번 주 많이 이야기된 선수</h2>${top.length?`<ol class="rank">${top.map(([id,n],i)=>{const p=byId(+id);return `<li><button data-side="${id}"><span class="n">${i+1}</span><span>${esc(p.name)} <span class="muted">${esc(p.team)}</span></span><b>${n}개</b></button></li>`}).join('')}</ol>`:'<p class="muted">아직 집계할 글이 없어요.</p>'}
    <h2 style="margin-top:18px">작성 규칙</h2>
    <p class="muted" style="font-size:.85rem;margin:0">심한 욕설, 혐오·비하 표현, 위협, 전화번호 같은 개인정보가 들어간 글은 올릴 수 없어요. 거친 표현은 자동으로 가려지고, 신고가 3번 쌓인 글은 가려져요. 도배를 막기 위해 30초에 한 번 글을 올릴 수 있어요.</p>`;
  el.querySelectorAll('[data-side]').forEach(b=>b.onclick=()=>{COMM.filter={player:+b.dataset.side,media:false};vCommunity()});
}
initComm();

render();
</script>
</body>
</html>
